[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311" 

[tool.ruff.lint]
select = [
    "E", 
    "W",  
    "F", 
    "I",  
    "C", 
    "B",
]
ignore = [
    "E501",
    "W191",
    "E203", 
    "E231",
    "E402", 
    "E731",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"